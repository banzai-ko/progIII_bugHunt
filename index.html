<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            
            <h1>Biblioteca Personal</h1>
            <nav>
                <ul>
                    <li><a href="#formulario-seccion">formulario</a></li>
                    <li><a href="#tabla-seccion">tabla</a></li>
                    <li><a href="#estadisticas-seccion">estadisticas</a></li>
                </ul>
            </nav>
        </header>

        <section id="formulario-seccion">
            <form id="formulario-libro">
                <div>
                    <label for="titulo">Titulo:</label>
                    <input type="text" id="titulo" name="titulo" required>
                </div>

                <div>
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" name="autor" required>
                </div>

                <div>
                    <label for="genero">Genero:</label>
                    <select id="genero" name="genero" required>
                        <option value=""> seleccione un genero </option>
                        <option value="Ficcion">Ficcion</option>
                        <option value="No Ficción">No Ficción</option>
                        <option value="Técnico">Técnico</option>
                        <option value="Ciencia">Ciencia</option>
                    </select>
                </div>

                <div>
                    <label for="anio">Año</label>
                    <input type="text" id="anio" name="anio" max="2099" required>

                </div>

                <div>
                    <label for="estado">Estado</label>
                    <select name="estado" id="estado">
                        <option value=""> seleccione un estado </option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Leyendo">Leyendo</option>
                        <option value="Leído">Leído</option>
                    </select>
                </div>

                <div>
                    <label for="paginas">paginas</label>
                    <input type="number" id="paginas" name="paginas" min="0"  max="2099" required>
                </div>

                <button type="submit" class="btn-guardar-libro"> Guerdar libro </button>

            </form>


        </section>


        <section id="tabla-seccion" >

            <div class="controles-filtro">
            <label for="filtro-genero"> filtrar por genero: </label>
                <select id="filtro-genero">
                    <option value=""> Todos </option>
                    <option value="Ficción"> Ficcion </option>
                    <option value="No Ficción"> No Ficcion</option>
                    <option value="Técnico"> Tecnico </option>
                    <option value="Ciencia"> Ciencia </option>
                </select>

                <label for="filtro-estado"> Filtrar por estado </label>
                <select id="filtro-estado">

                    <option value=""> Todos </option>
                    <option value="Pendiente"> Pendiente </option>
                    <option value="Leyendo"> Leyendo </option>
                    <option value="Leído"> Leído </option>
                
                </select>

            </div>

            <table id="tabla-libros">
                <thead>
                    <th>Título</th>
                        <th>Autor</th>
                        <th>Genero</th>
                        <th>Año</th>
                        <th>Paginas</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </thead>
                    
                <tbody id="cuerpo-tabla">

                        
                </tbody>

            </table>
        </section>

        <section id="estadisticas-seccion">

            <div  class="lista-estadisticas ">
                
                
                <ul id="lista-estadisticas">


                </ul>

            </div>

        </section>


        <script src="app.js"></script>

        <script src="datos.js"></script>

        

        
    </body>

</html>
